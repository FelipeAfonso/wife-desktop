# Drop-in: survives `t3 service install/update` rewriting the main unit file.
# Providers (claude, codex, opencode) are bun globals in ~/.bun/bin so the
# app.t3.codes update button can update them without root. The server's
# default PATH is the bare system one; prepend the user dirs so it resolves
# the bun-installed binaries and can run `bun i -g` itself. BUN_INSTALL keeps
# bun's global dir at ~/.bun (matches .zshrc) instead of ~/.cache/.bun.
[Service]
Environment=BUN_INSTALL=%h/.bun
Environment=PATH=%h/.local/bin:%h/.bun/bin:/usr/local/sbin:/usr/local/bin:/usr/bin:/opt/cuda/bin:/usr/bin/site_perl:/usr/bin/vendor_perl:/usr/bin/core_perl:/opt/rocm/bin
